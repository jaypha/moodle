issueNumber: MDL-83532
notes:
  core:
    - message: >-
        Improved times for course completion checks.
        Added 'completion_completion_notify_time_window' CFG value.
        This value is used to determine the time window for course completion email notifications (Email will
        not be sent if the time of completion is too old).
        Separated criteria checks from completion_regular_task into
        their own tasks (completion_criteria_*_check_task, where * is the criteria type).
        Course completion and grade checks are now designed to run 'as needed'.
        Date completion is run once per day.
        Added 'completion_criteria_*_check_lasttime' config values. These record the starting times of the last
        successful run of the tasks. * = criteria type.
        Added completion_criteria_check_full_check_task ad-hoc task. This task can perform a full check of all criteria.
      type: improved
